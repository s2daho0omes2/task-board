<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة المهام والتحديثات</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --panel-2:#1c232c; --line:#2a323d;
    --text:#e6edf3; --muted:#8b949e; --accent:#4f9dff; --accent-2:#2f6fd0;
    --green:#3fb950; --amber:#d29922; --red:#f85149; --violet:#a371f7;
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;
    font-size:15px; line-height:1.7;
  }
  a{color:var(--accent)}
  button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer}

  /* ===== Header ===== */
  header{
    position:sticky; top:0; z-index:50; backdrop-filter:blur(8px);
    background:rgba(14,17,22,.85); border-bottom:1px solid var(--line);
  }
  .head-wrap{max-width:100%;margin:0 auto;padding:14px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:var(--accent);box-shadow:0 0 12px var(--accent)}
  .stats{color:var(--muted);font-size:13px}
  .spacer{flex:1}
  .btn{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text);
    padding:8px 14px; border-radius:10px; transition:.15s; white-space:nowrap;
  }
  .btn:hover{border-color:var(--accent);background:#222b36}
  .btn.primary{background:var(--accent-2);border-color:var(--accent-2)}
  .btn.primary:hover{background:var(--accent)}
  .btn.ghost{background:transparent}
  .btn.sm{padding:4px 10px;font-size:13px;border-radius:8px}
  .btn.danger:hover{border-color:var(--red);color:var(--red)}

  /* ===== Toolbar ===== */
  .toolbar{padding:16px 18px 4px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .search{flex:1;min-width:220px;position:relative}
  .search input{
    width:100%;padding:10px 38px 10px 12px;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;outline:none;
  }
  .search input:focus{border-color:var(--accent)}
  .search::before{content:"🔍";position:absolute;right:12px;top:9px;opacity:.6}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-size:13px;cursor:pointer}
  .tab.active{background:var(--accent-2);border-color:var(--accent-2);font-weight:600}

  /* ===== Canvas (free drag area) ===== */
  .canvas{
    position:relative; min-height:calc(100vh - 140px); padding:16px;
    overflow:auto; scroll-behavior:smooth;
  }
  .grid-mode .canvas{ display:flex; flex-wrap:nowrap; gap:16px; overflow-x:auto; overflow-y:hidden; align-items:flex-start; padding-bottom:20px; }
  .grid-mode .card{ min-width:340px; max-width:370px; flex-shrink:0; }

  /* ===== Card ===== */
  .card{
    background:var(--panel);border:none;border-radius:22px;
    display:flex;flex-direction:column;overflow:visible;
    transition:transform .35s cubic-bezier(.4,0,.2,1), box-shadow .35s ease;
    width:380px; min-height:180px;
    box-shadow:0 8px 32px rgba(0,0,0,.4);
    position:relative;
  }
  .card>*{overflow:hidden;}
  .grid-mode .card{ position:static !important; width:auto; }
  .free-mode .card{ position:absolute; z-index:1; }
  .free-mode .card.dragging{ z-index:999; box-shadow:0 24px 64px rgba(0,0,0,.6); cursor:grabbing; transform:scale(1.04) rotate(-1deg); }
  .card:hover{ transform:translateY(-6px) scale(1.01); box-shadow:0 16px 48px rgba(0,0,0,.5);}
  .card.stale{}
  .card.done{opacity:.4; filter:grayscale(.4)}

  /* ===== Status ribbon (شريط الحالة الجانبي) ===== */
  .card::before{
    content:""; position:absolute; top:20px; right:-4px; width:8px; bottom:20px;
    border-radius:4px; background:var(--accent); z-index:5;
    box-shadow:0 0 14px rgba(79,157,255,.4);
  }
  .card.stale::before{background:var(--amber);box-shadow:0 0 14px rgba(210,153,34,.4)}
  .card.done::before{background:var(--green);box-shadow:0 0 14px rgba(63,185,80,.3);opacity:.5}

  /* ===== Status header bar ===== */
  .card-status-bar{
    padding:10px 20px; display:flex; align-items:center; justify-content:space-between;
    font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em;
    border-radius:22px 22px 0 0;
  }
  .card .badge.s-new ~ .card-status-bar, .s-new-bar{background:linear-gradient(135deg,#1a3a5c,#0d2240);color:#6cb6ff}
  .s-doing-bar{background:linear-gradient(135deg,#2d1b4e,#1a1030);color:#c49bff}
  .s-wait-bar{background:linear-gradient(135deg,#3d2e10,#2a1f08);color:#f5c842}
  .s-done-bar{background:linear-gradient(135deg,#0f2e18,#0a1d10);color:#56d364}

  /* ===== تايمر التحديث ===== */
  .stale-timer{
    display:inline-flex;align-items:center;gap:5px;
    font-size:11px;font-weight:800;padding:6px 14px;border-radius:10px;
    letter-spacing:.02em;
  }
  .stale-timer.green{color:#5cff8a;background:rgba(63,185,80,.12)}
  .stale-timer.amber{color:#ffc44d;background:rgba(210,153,34,.12)}
  .stale-timer.red{color:#ff6b6b;background:rgba(248,81,73,.15);animation:pulse-red 2s infinite}

  .card-head{padding:18px 22px 14px;cursor:grab; position:relative;border-bottom:none;}
  .card-head:active{cursor:grabbing}
  .row{display:flex;align-items:flex-start;gap:10px}
  .title{font-weight:900;font-size:18px;flex:1;word-break:break-word;line-height:1.5;letter-spacing:-.02em;color:#fff}
  .card.done .title{text-decoration:line-through;opacity:.5}
  .desc{color:var(--muted);font-size:13px;margin-top:8px;white-space:pre-wrap;word-break:break-word;line-height:1.65;opacity:.7}
  .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
  .badge{
    font-size:10.5px;padding:6px 14px;border-radius:10px;border:none;font-weight:700;letter-spacing:.03em;
    background:rgba(255,255,255,.05); color:var(--muted);
  }
  .badge.s-new{color:#6cb6ff;background:rgba(79,157,255,.12)}
  .badge.s-doing{color:#c49bff;background:rgba(163,113,247,.12)}
  .badge.s-wait{color:#f5c842;background:rgba(210,153,34,.12)}
  .badge.s-done{color:#56d364;background:rgba(63,185,80,.12)}
  .badge.p-high{color:#ff7b72;background:rgba(248,81,73,.15);animation:pulse-red 3s infinite}
  .badge.today{color:#56d364;background:rgba(63,185,80,.1)}

  /* ===== Color stripe ===== */
  .card[data-color]{ border-top:none; }

  /* ===== Divider ===== */
  .card-divider{height:1px;margin:0 22px;background:linear-gradient(90deg,transparent,var(--line),transparent)}

  .updates{padding:14px 22px 8px;flex:1;max-height:340px;overflow:auto}
  .empty-u{color:var(--muted);font-size:13px;padding:16px 0;text-align:center;opacity:.5}
  .u{
    position:relative;padding:12px 0;
    margin-right:0; transition:all .2s; border-right:none;
  }
  .u+.u{border-top:1px solid rgba(255,255,255,.04)}
  .u:hover{background:rgba(255,255,255,.02);border-radius:10px;margin:0 -8px;padding:12px 8px}
  .u::before{display:none}
  .u.is-today::before{display:none}
  .u-meta{font-size:10.5px;color:var(--muted);display:flex;gap:8px;align-items:center;opacity:.6}
  .u-text{white-space:pre-wrap;word-break:break-word;font-size:14.5px;margin-top:5px;line-height:1.7;color:rgba(230,237,243,.85)}

  /* === آخر تحديث بارز === */
  .u.is-latest{
    background:linear-gradient(135deg, rgba(79,157,255,.1), rgba(47,111,208,.04));
    border-radius:14px; padding:16px 18px;
    border-right:none; margin:-4px -8px 8px; border-top:none;
    border:1px solid rgba(79,157,255,.12);
  }
  .u.is-latest .u-text{
    font-size:17.5px; font-weight:800; color:#fff; line-height:1.7;
  }
  .u.is-latest::before{display:none}

  .u .del{visibility:hidden;background:none;border:none;color:var(--muted);padding:4px 8px;font-size:12px;transition:all .15s;border-radius:8px}
  .u:hover .del{visibility:visible}
  .u .del:hover{color:var(--red);background:rgba(248,81,73,.1)}
  .more{background:rgba(79,157,255,.08);border:none;color:var(--accent);font-size:12px;padding:8px 16px;font-weight:700;border-radius:10px;margin:4px 0;transition:all .2s}
  .more:hover{background:rgba(79,157,255,.15)}

  .card-foot{padding:16px 22px 20px;background:rgba(22,27,34,.5)}
  .card-foot textarea{
    width:100%;min-height:50px;max-height:160px;resize:vertical;padding:13px 16px;
    background:var(--bg);border:2px solid var(--line);border-radius:14px;outline:none;
    transition:all .3s ease; font-size:14px;
  }
  .card-foot textarea:focus{border-color:var(--accent);box-shadow:0 0 0 4px rgba(79,157,255,.1)}
  .foot-row{display:flex;gap:8px;align-items:center;margin-top:12px}
  .hint{color:var(--muted);font-size:11px;opacity:.35}

  .empty{
    text-align:center;padding:70px 20px;color:var(--muted);
    border:1px dashed var(--line);border-radius:var(--radius);
  }

  /* ===== Color picker row ===== */
  .color-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .color-dot{
    width:28px;height:28px;border-radius:50%;border:3px solid transparent;cursor:pointer;
    transition:.15s;
  }
  .color-dot:hover{transform:scale(1.15)}
  .color-dot.active{border-color:#fff;box-shadow:0 0 8px rgba(255,255,255,.3)}
  .color-dot[data-c="none"]{background:var(--panel);border:2px dashed var(--line)}

  /* ===== Modal ===== */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;
    align-items:center;justify-content:center;padding:20px;z-index:100;
  }
  .overlay.open{display:flex}
  .modal{
    background:var(--panel);border:1px solid var(--line);border-radius:16px;
    width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:22px;
  }
  .modal h3{margin:0 0 16px}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
  .field input,.field textarea,.field select{
    width:100%;padding:10px 12px;background:var(--panel-2);
    border:1px solid var(--line);border-radius:10px;outline:none;
  }
  .field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
  .field textarea{min-height:80px;resize:vertical}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal-actions{display:flex;gap:10px;justify-content:flex-start;margin-top:18px}
  .note{font-size:12.5px;color:var(--muted);background:var(--panel-2);border:1px solid var(--line);
        border-radius:10px;padding:10px 12px;margin-top:6px}
  #aiOut{
    white-space:pre-wrap;background:var(--panel-2);border:1px solid var(--line);
    border-radius:10px;padding:14px;margin-top:12px;min-height:60px;max-height:45vh;overflow:auto;font-size:14px;
  }
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
    background:var(--panel-2);border:1px solid var(--line);padding:10px 18px;border-radius:10px;
    opacity:0;transition:.25s;z-index:200;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  /* ===== Deadline timer ===== */
  .deadline-timer{
    display:inline-flex;align-items:center;gap:5px;
    font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;
  }
  .deadline-timer.dl-ok{color:var(--green);border:1px solid #27502e;background:#0f2417}
  .deadline-timer.dl-soon{color:var(--amber);border:1px solid #5c4a1d;background:#2a2210}
  .deadline-timer.dl-urgent{color:var(--red);border:1px solid #5e2b28;background:#2a1414;animation:pulse-red 2s infinite}
  .deadline-timer.dl-over{color:#ff6b6b;border:1px solid #5e2b28;background:#3a1414;animation:pulse-red 1.5s infinite}

  /* ===== أرشيف ===== */
  .archive-card{
    background:linear-gradient(145deg, rgba(30,37,48,.8), rgba(22,27,34,.9));
    border:1px solid rgba(255,255,255,.04);border-radius:20px;
    min-width:300px;max-width:340px;flex-shrink:0;padding:20px;opacity:.45;
    transition:all .3s cubic-bezier(.4,0,.2,1);
    box-shadow:0 2px 12px rgba(0,0,0,.2);
    backdrop-filter:blur(8px);
  }
  .archive-card:hover{opacity:1;border-color:rgba(86,211,100,.2);transform:translateY(-3px);box-shadow:0 8px 24px rgba(0,0,0,.3), 0 0 16px rgba(86,211,100,.05)}
  .archive-card .title{font-weight:800;font-size:15px;text-decoration:line-through;color:var(--muted)}
  .archive-card .a-meta{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6;opacity:.7}
  .archive-card .a-last{font-size:13px;margin-top:8px;color:var(--text);opacity:.7;line-height:1.6}
  @keyframes pulse-red{0%,100%{opacity:1}50%{opacity:.45}}
  @keyframes card-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
  .card{animation:card-in .4s ease backwards}
  @media(max-width:600px){ .grid-mode .canvas{grid-template-columns:1fr} .two{grid-template-columns:1fr} .card{width:100%} }
</style>
</head>
<body>

<header>
  <div class="head-wrap">
    <div class="brand"><span class="dot"></span> لوحة المهام <span id="syncIcon" title="متصل بالسحابة" style="font-size:13px;opacity:.6">☁️</span></div>
    <div class="stats" id="stats"></div>
    <div class="spacer"></div>
    <button class="btn sm" id="btnMode" title="تبديل العرض">📌 عرض حر</button>
    <button class="btn primary" id="btnNew">+ مهمة جديدة</button>
    <button class="btn" id="btnAI">✨ تحليل بالذكاء الاصطناعي</button>
    <button class="btn ghost" id="btnExport" title="حفظ نسخة احتياطية">تصدير</button>
    <button class="btn ghost" id="btnImport" title="استرجاع نسخة">استيراد</button>
    <input type="file" id="fileIn" accept=".json" hidden>
  </div>
</header>

<div class="toolbar">
  <div class="search"><input id="q" placeholder="ابحث في العناوين والتحديثات..."></div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-f="all">الكل</button>
    <button class="tab" data-f="new">جديدة</button>
    <button class="tab" data-f="doing">قيد التنفيذ</button>
    <button class="tab" data-f="wait">معلّقة</button>
    <button class="tab" data-f="stale">تحتاج تحديث</button>
  </div>
  <select id="filterAssignee" style="background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;color:var(--text);font-size:13px;cursor:pointer">
    <option value="">كل المسؤولين</option>
  </select>
</div>

<main id="main" class="free-mode"><div class="canvas" id="grid"></div></main>

<!-- أرشيف المهام المكتملة -->
<section id="archiveSection" style="display:none;padding:0 18px 30px">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;cursor:pointer" id="archiveToggle">
    <h3 style="margin:0;font-size:17px;color:var(--muted)">📦 الأرشيف <span id="archiveCount" style="font-size:14px"></span></h3>
    <span id="archiveArrow" style="color:var(--muted);font-size:13px">▼</span>
  </div>
  <div id="archiveGrid" style="display:none;flex-wrap:nowrap;gap:14px;overflow-x:auto;padding-bottom:14px"></div>
</section>

<!-- مودال المهمة -->
<div class="overlay" id="taskModal">
  <div class="modal">
    <h3 id="taskModalTitle">مهمة جديدة</h3>
    <input type="hidden" id="tId">
    <div class="field"><label>عنوان المهمة</label><input id="tTitle" placeholder="مثال: تجهيز تقرير الربع الثالث"></div>
    <div class="field"><label>وصف مختصر (اختياري)</label><textarea id="tDesc" placeholder="تفاصيل، هدف المهمة، رابط..."></textarea></div>
    <div class="two">
      <div class="field"><label>الحالة</label>
        <select id="tStatus">
          <option value="new">جديدة</option>
          <option value="doing">قيد التنفيذ</option>
          <option value="wait">معلّقة</option>
          <option value="done">مكتملة</option>
        </select>
      </div>
      <div class="field"><label>الأولوية</label>
        <select id="tPriority">
          <option value="normal">عادية</option>
          <option value="high">عالية</option>
        </select>
      </div>
    </div>
    <div class="field"><label>الموعد النهائي (اختياري)</label>
      <input id="tDeadline" type="date" style="background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text);width:100%"></div>
    <div class="field"><label>المسؤول</label>
      <div style="display:flex;gap:8px">
        <select id="tAssignee" style="flex:1;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--text)">
          <option value="">بدون مسؤول</option>
        </select>
        <button class="btn sm" id="btnAddPerson" type="button" title="إضافة مسؤول جديد">+ شخص</button>
      </div>
    </div>
    <div class="field">
      <label>لون البطاقة</label>
      <div class="color-row" id="colorRow">
        <div class="color-dot active" data-c="none" title="بدون"></div>
        <div class="color-dot" data-c="#4f9dff" style="background:#4f9dff" title="أزرق"></div>
        <div class="color-dot" data-c="#a371f7" style="background:#a371f7" title="بنفسجي"></div>
        <div class="color-dot" data-c="#3fb950" style="background:#3fb950" title="أخضر"></div>
        <div class="color-dot" data-c="#d29922" style="background:#d29922" title="ذهبي"></div>
        <div class="color-dot" data-c="#f85149" style="background:#f85149" title="أحمر"></div>
        <div class="color-dot" data-c="#f778ba" style="background:#f778ba" title="وردي"></div>
        <div class="color-dot" data-c="#39d2c0" style="background:#39d2c0" title="تركواز"></div>
        <div class="color-dot" data-c="#ff8c42" style="background:#ff8c42" title="برتقالي"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn primary" id="tSave">حفظ</button>
      <button class="btn ghost" data-close>إلغاء</button>
      <div class="spacer"></div>
      <button class="btn danger" id="tDelete" style="display:none">حذف المهمة</button>
    </div>
  </div>
</div>

<!-- مودال الذكاء الاصطناعي -->
<div class="overlay" id="aiModal">
  <div class="modal" style="max-width:680px">
    <h3>✨ تحليل المهام بالذكاء الاصطناعي</h3>
    <div class="field"><label>المزوّد</label>
      <div class="tabs" id="providerTabs" style="margin-bottom:4px">
        <button class="tab active" data-prov="claude">Claude (Anthropic)</button>
        <button class="tab" data-prov="openai">OpenAI</button>
        <button class="tab" data-prov="custom">مزوّد آخر</button>
      </div>
    </div>
    <div class="two">
      <div class="field" id="fBase" style="display:none"><label>عنوان الـ API</label>
        <input id="aiBase" placeholder="https://api.openai.com/v1"></div>
      <div class="field"><label>النموذج</label>
        <input id="aiModel" placeholder="claude-haiku-4-5"></div>
    </div>
    <div class="field"><label>مفتاح الـ API</label>
      <input id="aiKey" type="password" placeholder="sk-ant-..." autocomplete="off"></div>
    <div class="field"><label>اطلب ما تريد</label>
      <textarea id="aiPrompt">حلّل بيانات المهام وأعطني التقرير التالي بالضبط:

📊 ملخص سريع
سطر واحد فيه: عدد قيد التنفيذ · عدد جديدة · عدد مكتملة · عدد المهام اللي ما تم تحديثها من أكثر من يوم
مثال: 6 قيد التنفيذ · 10 جديدة · 0 مكتملة · 5 لم يتم التحديث

📋 أولويات اليوم
رتّب جميع المهام الغير مكتملة بالأهمية. معايير الترتيب:
- المهام اللي ما تحدثت من فترة أطول = أهمية أعلى
- المهام العالقة أو المعتمدة على طرف خارجي = أهمية أعلى
- المهام قيد التنفيذ قبل الجديدة

لكل مهمة اكتبها بهذا الشكل:
رقم. ⭐⭐⭐ اسم المهمة — سبب مختصر | ⏰ آخر تحديث: قبل X يوم

/* ================= أدوات ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAY = 86400000;

function isToday(ts){ const a=new Date(ts),b=new Date(); return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }
function fmt(ts){ const d=new Date(ts),p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} · ${p(d.getHours())}:${p(d.getMinutes())}`; }
function rel(ts){
  const m=Math.floor((Date.now()-ts)/60000);
  if(m<1)return"الآن"; if(m<60)return`قبل ${m} دقيقة`;
  const h=Math.floor(m/60); if(h<24)return`قبل ${h} ساعة`;
  const d=Math.floor(h/24); if(d===1)return"أمس"; if(d<30)return`قبل ${d} يوم`;
  return`قبل ${Math.floor(d/30)} شهر`;
}
function lastAt(t){ if(!t||!t.updates)return 0; return t.updates.length ? Math.max(...t.updates.map(u=>u.at)) : (t.created||0); }
function isStale(t){ return t&&t.status!=="done"&&(Date.now()-lastAt(t))>2*DAY; }
const STATUS={new:"جديدة",doing:"قيد التنفيذ",wait:"معلّقة",done:"مكتملة"};

/* ================= Auto-layout for free mode ================= */
function autoLayout(){
  const cols = Math.max(1, Math.floor((window.innerWidth - 40) / 400));
  const colW = 380, gap = 16, padX = 20, padY = 10;
  let colHeights = new Array(cols).fill(0);
  tasks.forEach(t=>{
    if(t.x != null && t.y != null) return; // already positioned
    const shortest = colHeights.indexOf(Math.min(...colHeights));
    t.x = padX + shortest * (colW + gap);
    t.y = padY + colHeights[shortest];
    colHeights[shortest] += 260 + gap;
  });
}

/* ================= العرض ================= */
function visible(){
  const q=query.trim().toLowerCase();
  return tasks.filter(t=>t&&t.id).filter(t=>{
    // المكتملة تروح للأرشيف إلا إذا المستخدم اختار فلتر "مكتملة"
    if(t.status==="done"&&filter!=="done") return false;
    if(filterAssignee && (t.assignee||"")!==filterAssignee) return false;
    if(filter==="stale"){ if(!isStale(t))return false; }
    else if(filter!=="all"&&filter!=="done"&&t.status!==filter)return false;
    if(!q)return true;
    return(t.title+" "+(t.desc||"")+" "+(t.updates||[]).map(u=>u.text).join(" ")).toLowerCase().includes(q);
  }).sort((a,b)=>{
    if((a.priority==="high")!==(b.priority==="high"))return a.priority==="high"?-1:1;
    return lastAt(b)-lastAt(a);
  });
}

function render(){

    }).join("")
    : `<div class="empty-u">لا توجد تحديثات بعد — اكتب أول تحديث بالأسفل.</div>`;

        </div>
        ${t.desc?`<div class="desc">${esc(t.desc)}</div>`:""}
        <div class="badges">
          ${t.assignee?`<span class="badge" style="color:#8cc8ff;background:rgba(79,157,255,.1)">👤 ${esc(t.assignee)}</span>`:""}
          ${t.priority==="high"?'<span class="badge p-high">🔥 أولوية عالية</span>':""}
          <span class="badge">📝 ${(t.updates||[]).length} تحديث</span>

            const days=Math.round((now-last)/DAY);

        </div>
      </div>`;
    }).join("");
  } else {

/* ================= السحب (Drag) ================= */
let dragState = null;

document.addEventListener("pointerdown", e=>{
  if(!freeMode) return;
  const head = e.target.closest("[data-drag]");
  if(!head) return;
  if(e.target.closest("button")) return; // don't drag from buttons
  const card = head.closest(".card");
  const tid = head.dataset.drag;
  const t = tasks.find(x=>x.id===tid);
  if(!t) return;
  e.preventDefault();
  card.classList.add("dragging");
  card.setPointerCapture(e.pointerId);
  dragState = { tid, startX:e.clientX, startY:e.clientY, origX:t.x||0, origY:t.y||0, card, moved:false };
});

document.addEventListener("pointermove", e=>{
  if(!dragState) return;
  const dx = e.clientX - dragState.startX;
  const dy = e.clientY - dragState.startY;
  if(Math.abs(dx)+Math.abs(dy) > 4) dragState.moved = true;
  const nx = Math.max(0, dragState.origX + dx);
  const ny = Math.max(0, dragState.origY + dy);
  dragState.card.style.left = nx + "px";
  dragState.card.style.top = ny + "px";
});

document.addEventListener("pointerup", e=>{
  if(!dragState) return;
  dragState.card.classList.remove("dragging");
  if(dragState.moved){
    const dx = e.clientX - dragState.startX;
    const dy = e.clientY - dragState.startY;
    const t = tasks.find(x=>x.id===dragState.tid);
    if(t){
      t.x = Math.max(0, dragState.origX + dx);
      t.y = Math.max(0, dragState.origY + dy);
      save();
    }
  }
  dragState = null;
});

/* ================= التفاعل ================= */
function addUpdate(id){
  const box=document.querySelector(`[data-input="${id}"]`);
  const text=box.value.trim();
  if(!text){box.focus();return;}
  const t=tasks.find(x=>x.id===id);
  if(!t.updates)t.updates=[];
  t.updates.push({id:uid(),at:Date.now(),text});
  if(t.status==="new")t.status="doing";
  save();render();toast("تم حفظ التحديث ✓");
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  const d=b.dataset;
  if(d.add)return addUpdate(d.add);
  if(d.more){expanded.has(d.more)?expanded.delete(d.more):expanded.add(d.more);return render();}
  if(d.edit)return openTask(d.edit);
  if(d.done){tasks.find(t=>t.id===d.done).status="done";save();render();return toast("اكتملت المهمة ✓");}
  if(d.reopen){tasks.find(t=>t.id===d.reopen).status="doing";save();render();return;}
  if(d.delU){
    const[tid,uidv]=d.delU.split("|");
    if(!confirm("حذف هذا التحديث؟"))return;
    const t=tasks.find(x=>x.id===tid);
    t.updates=(t.updates||[]).filter(u=>u.id!==uidv);
    save();render();return;
  }
  if(b.hasAttribute("data-close"))b.closest(".overlay").classList.remove("open");
});

document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&(e.ctrlKey||e.metaKey)){
    const ta=e.target.closest("textarea[data-input]");
    if(ta){e.preventDefault();addUpdate(ta.dataset.input);}
  }
  if(e.key==="Escape")document.querySelectorAll(".overlay.open").forEach(o=>o.classList.remove("open"));
});

$("#q").addEventListener("input",e=>{query=e.target.value;render();});
$("#tabs").addEventListener("click",e=>{
  const t=e.target.closest(".tab");if(!t)return;
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active");filter=t.dataset.f;render();
});

/* ===== مودال المهمة ===== */
let selectedColor = "none";
document.getElementById("colorRow").addEventListener("click",e=>{
  const dot=e.target.closest(".color-dot"); if(!dot)return;
  document.querySelectorAll(".color-dot").forEach(d=>d.classList.remove("active"));
  dot.classList.add("active");
  selectedColor = dot.dataset.c;
});

function openTask(id){
  const t=id?tasks.find(x=>x.id===id):null;
  $("#taskModalTitle").textContent=t?"تعديل المهمة":"مهمة جديدة";
  $("#tId").value=t?t.id:"";
  $("#tTitle").value=t?t.title:"";
  $("#tDesc").value=t?(t.desc||""):"";
  $("#tStatus").value=t?t.status:"new";
  $("#tPriority").value=t?t.priority:"normal";
  $("#tDeadline").value=t&&t.deadline?t.deadline:"";
  populateAssigneeSelects();
  $("#tAssignee").value=t&&t.assignee?t.assignee:"";
  $("#tDelete").style.display=t?"":"none";
  // color
  selectedColor = t&&t.color ? t.color : "none";
  document.querySelectorAll(".color-dot").forEach(d=>{
    d.classList.toggle("active", d.dataset.c===selectedColor);
  });
  $("#taskModal").classList.add("open");
  setTimeout(()=>$("#tTitle").focus(),50);
}
$("#btnNew").onclick=()=>openTask(null);
$("#tSave").onclick=()=>{
  const title=$("#tTitle").value.trim();
  if(!title){$("#tTitle").focus();return toast("اكتب عنوان المهمة");}
  const id=$("#tId").value;
  const color = selectedColor==="none" ? "" : selectedColor;
  if(id){
    const t=tasks.find(x=>x.id===id);
    Object.assign(t,{title,desc:$("#tDesc").value.trim(),status:$("#tStatus").value,priority:$("#tPriority").value,color,deadline:$("#tDeadline").value||"",assignee:$("#tAssignee").value||""});
  }else{
    const maxNum=tasks.reduce((m,t)=>Math.max(m,t.num||0),0);
    tasks.push({id:uid(),num:maxNum+1,title,desc:$("#tDesc").value.trim(),status:$("#tStatus").value,
                priority:$("#tPriority").value,color,deadline:$("#tDeadline").value||"",assignee:$("#tAssignee").value||"",created:Date.now(),updates:[]});
  }
  save();render();$("#taskModal").classList.remove("open");toast("تم الحفظ ✓");
};
$("#tDelete").onclick=()=>{
  const id=$("#tId").value;
  if(!confirm("حذف المهمة وكل تحديثاتها؟"))return;
  tasks=tasks.filter(t=>t.id!==id);
  save();render();$("#taskModal").classList.remove("open");toast("تم الحذف");
};

/* ===== إضافة مسؤول جديد ===== */
$("#btnAddPerson").onclick=()=>{
  const name=prompt("اكتب اسم المسؤول الجديد:");
  if(!name||!name.trim())return;
  const n=name.trim();
  if(people.includes(n))return toast("موجود مسبقاً");
  people.push(n);
  savePeople();
  populateAssigneeSelects();
  $("#tAssignee").value=n;
  toast("تمت إضافة: "+n);
};

/* ===== فلتر المسؤول ===== */
$("#filterAssignee").onchange=e=>{ filterAssignee=e.target.value; render(); };

/* ===== تصدير / استيراد ===== */
$("#btnExport").onclick=()=>{
  const blob=new Blob([JSON.stringify(tasks,null,2)],{type:"application/json"});
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=`tasks-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}.json`;
  a.click();URL.revokeObjectURL(a.href);
};
$("#btnImport").onclick=()=>$("#fileIn").click();
$("#fileIn").onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      let data=JSON.parse(r.result);
      if(!Array.isArray(data))throw 0;
      // تنظيف وتأمين البيانات المستوردة
      data = data.filter(t=>t&&typeof t==="object"&&t.id&&t.title).map(t=>({
        id:t.id, title:String(t.title), desc:String(t.desc||""),
        status:["new","doing","wait","done"].includes(t.status)?t.status:"new",
        priority:t.priority==="high"?"high":"normal",
        color:/^#[0-9a-fA-F]{6}$/.test(t.color)?t.color:"",
        deadline:t.deadline||"", assignee:String(t.assignee||""),
        created:Number(t.created)||Date.now(),
        updates:Array.isArray(t.updates)?t.updates.filter(u=>u&&u.id&&u.text).map(u=>({
          id:u.id, at:Number(u.at)||Date.now(), text:String(u.text)
        })):[]
      }));
      if(!data.length)throw 0;
      if(!confirm("دمج المهام المستوردة مع الحالية؟ (إلغاء = استبدال الكل)")){tasks=data;}
      else{ const ids=new Set(tasks.map(t=>t.id)); data.forEach(t=>{if(!ids.has(t.id))tasks.push(t);}); }
      save();render();toast("تم الاستيراد ✓ ("+data.length+" مهمة)");
    }catch(err){toast("ملف غير صالح");}
  };
  r.readAsText(f);e.target.value="";
};

/* ================= ربط الـ AI ================= */
function cfg(){try{return JSON.parse(localStorage.getItem(CFG)||"{}") }catch(e){return{};}}
function setCfg(o){localStorage.setItem(CFG,JSON.stringify(o));}

let provider = "claude";
const PROVIDERS = {
  claude:{ base:"https://api.anthropic.com", model:"claude-haiku-4-5", placeholder:"sk-ant-..." },
  openai:{ base:"https://api.openai.com/v1", model:"gpt-4.1-mini", placeholder:"sk-..." },
  custom:{ base:"", model:"", placeholder:"..." }
};

function setProvider(p){
  provider = p;
  document.querySelectorAll("#providerTabs .tab").forEach(t=>{
    t.classList.toggle("active", t.dataset.prov===p);
  });
  const c = cfg();
  const def = PROVIDERS[p];
  $("#aiBase").value = c[p+"_base"] || def.base;
  $("#aiModel").value = c[p+"_model"] || def.model;
  $("#aiKey").value = c[p+"_key"] || "";
  $("#aiKey").placeholder = def.placeholder;
  // show/hide base URL field
  $("#fBase").style.display = p==="custom" ? "" : "none";
  // model placeholder
  $("#aiModel").placeholder = def.model || "model-name";
}

$("#providerTabs").addEventListener("click", e=>{
  const t=e.target.closest("[data-prov]"); if(!t) return;
  setProvider(t.dataset.prov);
});

$("#btnAI").onclick=()=>{
  const c=cfg();
  provider = c.lastProvider || "claude";
  setProvider(provider);
  $("#aiModal").classList.add("open");
};

function boardText(){
  return tasks.map(t=>{
    const ups=[...(t.updates||[])].sort((a,b)=>a.at-b.at)
      .map(u=>`    - [${fmt(u.at)}] ${u.text}`).join("\n")||"    (لا توجد تحديثات)";
    return`• المهمة: ${t.title}\n  الحالة: ${STATUS[t.status]} | الأولوية: ${t.priority==="high"?"عالية":"عادية"} | آخر نشاط: ${fmt(lastAt(t))}\n  الوصف: ${t.desc||"—"}\n  التحديثات:\n${ups}`;
  }).join("\n\n")||"لا توجد مهام.";
}

$("#aiRun").onclick=async()=>{
  const base=$("#aiBase").value.trim().replace(/\/+$/,"");
  const model=$("#aiModel").value.trim();
  const key=$("#aiKey").value.trim();
  const ask=$("#aiPrompt").value.trim();
  if(!model||!key)return toast("أكمل النموذج والمفتاح");
  if(provider==="custom"&&!base)return toast("أكمل عنوان الـ API");

  // save per-provider
  const c=cfg();
  c[provider+"_base"]=base; c[provider+"_model"]=model; c[provider+"_key"]=key;
  c.lastProvider=provider;
  setCfg(c);
  saveConfigFirebase();

  const sys="أنت مساعد مدير مشاريع محترف. أجب بالعربية فقط. لا مقدمات ولا خاتمة — ابدأ مباشرة. استخدم النجوم ⭐ للأهمية وساعة ⏰ لآخر تحديث. لا تكرر بيانات المهام — حلّل واستنتج. استند فقط على البيانات المعطاة. التاريخ الآن: "+fmt(Date.now())+".";
  const userMsg=`${ask}\n\n=== بيانات اللوحة (${tasks.length} مهمة) ===\n${boardText()}`;
  const out=$("#aiOut"),st=$("#aiStatus");
  out.textContent="";st.textContent="جارٍ الإرسال...";
  $("#aiRun").disabled=true;
  try{
    let text;
    if(provider==="claude"){
      text = await callClaude(key, model, sys, userMsg);
    } else {
      const b = provider==="openai" ? "https://api.openai.com/v1" : base;
      text = await callOpenAI(b, key, model, sys, userMsg);
    }
    out.textContent=text;
    st.textContent="تم ✓";
    $("#aiCopy").style.display="";
  }catch(err){out.textContent="خطأ: "+err.message;st.textContent="فشل";$("#aiCopy").style.display="none";}
  finally{$("#aiRun").disabled=false;}
};

$("#aiCopy").onclick=()=>{
  const text=$("#aiOut").textContent;
  if(!text)return;
  navigator.clipboard.writeText(text).then(()=>toast("تم نسخ الملخص ✓")).catch(()=>{
    const ta=document.createElement("textarea");ta.value=text;document.body.appendChild(ta);ta.select();document.execCommand("copy");document.body.removeChild(ta);toast("تم نسخ الملخص ✓");
  });
};

/* --- Claude (Anthropic Messages API) --- */
async function callClaude(key, model, sys, user){
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{
      "content-type":"application/json",
      "x-api-key": key,
      "anthropic-version":"2023-06-01",
      "anthropic-dangerous-direct-browser-access":"true"
    },
    body:JSON.stringify({
      model,
      max_tokens:4096,
      system: sys,
      messages:[{role:"user",content:user}]
    })
  });
  const j = await res.json();
  if(!res.ok) throw new Error(j?.error?.message || ("HTTP "+res.status));
  // extract text from content blocks
  if(j.content && Array.isArray(j.content)){
    return j.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");
  }
  return JSON.stringify(j,null,2);
}

/* --- OpenAI / Custom (Responses → Chat Completions fallback) --- */
async function callOpenAI(base, key, model, sys, user){
  let res=await fetch(base+"/responses",{
    method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
    body:JSON.stringify({model,input:[{role:"system",content:sys},{role:"user",content:user}]})
  });
  if(res.status===404||res.status===400){
    const alt=await fetch(base+"/chat/completions",{
      method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},
      body:JSON.stringify({model,messages:[{role:"system",content:sys},{role:"user",content:user}]})
    });
    const aj=await alt.json();
    if(!alt.ok)throw new Error(aj?.error?.message||("HTTP "+alt.status));
    return aj.choices?.[0]?.message?.content||JSON.stringify(aj,null,2);
  }
  const j=await res.json();
  if(!res.ok)throw new Error(j?.error?.message||("HTTP "+res.status));
  return typeof j.output_text==="string"&&j.output_text ? j.output_text :
    (j.output||[]).flatMap(i=>(i.content||[]).filter(c=>c.type==="output_text").map(c=>c.text)).join("\n")||JSON.stringify(j,null,2);
}

/* ===== Firebase data helper ===== */
function fbToArray(data){
  const raw = Array.isArray(data) ? data : Object.values(data);
  return raw.filter(t=>t&&typeof t==="object"&&t.id).map(t=>({
    ...t,
    updates: Array.isArray(t.updates) ? t.updates.filter(u=>u&&u.id) :
             (t.updates && typeof t.updates==="object") ? Object.values(t.updates).filter(u=>u&&u.id) : []
  }));
}

/* ================= Firebase real-time sync ================= */
if(useFirebase){
  tasksRef.once("value", snap=>{
    const data = snap.val();
    if(!data){
      // القاعدة فاضية — نرفع كـ map
      const map = {}; tasks.forEach(t=>{ if(t&&t.id) map[t.id]=t; });
      tasksRef.set(map);
      peopleRef.set(people);
      toast("☁️ تم رفع المهام للسحابة");
    } else {
      tasks = fbToArray(data);
      localStorage.setItem(KEY, JSON.stringify(tasks));
      render();
    }
    firebaseReady = true;
    tasksRef.on("value", snap2=>{
      const d = snap2.val();
      tasks = d ? fbToArray(d) : [];
      localStorage.setItem(KEY, JSON.stringify(tasks));
      render();
    });
  });

  peopleRef.once("value", snap=>{
    const data = snap.val();
    if(data){
      const arr = Array.isArray(data) ? data : Object.values(data);
      if(arr.length){ people=arr; localStorage.setItem(PEOPLE_KEY,JSON.stringify(people)); populateAssigneeSelects(); }
    }
    peopleRef.on("value", snap2=>{
      const d=snap2.val();
      if(!d)return;
      const arr2=Array.isArray(d)?d:Object.values(d);
      if(arr2.length){ people=arr2; localStorage.setItem(PEOPLE_KEY,JSON.stringify(people)); populateAssigneeSelects(); }
    });
  });

  configRef.on("value", snap=>{
    const d=snap.val();
    if(d&&typeof d==="object"){
      localStorage.setItem(CFG_KEY,JSON.stringify(d));
    }
  });

  const connRef = db.ref(".info/connected");
  connRef.on("value", snap=>{
    const si = document.getElementById("syncIcon");
    if(snap.val()){
      if(si){ si.textContent="☁️"; si.title="متصل بالسحابة"; si.style.opacity=".6"; }
    } else {
      if(si){ si.textContent="⚡"; si.title="غير متصل — يعمل محلياً"; si.style.opacity="1"; }
    }
  });
} /* end useFirebase */

/* ================= تشغيل ================= */
populateAssigneeSelects();
render();
window.addEventListener("beforeunload",save);
})();
